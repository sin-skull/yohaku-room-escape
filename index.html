<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#303b30"><meta name="description" content="墨絵を読み、錠を回す。光と静けさの和室脱出ゲーム。"><title>余白 — YOHAKU</title><link rel="icon" href="./mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=1.5.0"></head><body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 5-6 5H2v4h3l6 5zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="m11 5-6 5H2v4h3l6 5zM17 9l5 6m0-6-5 6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.3c-1.1.5-1.1 1.2-1.1 2M12 17h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.8 7M4 4v6h6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 15a6 6 0 1 1 8 0c-1 .7-1 1.4-1 3H9c0-1.6 0-2.3-1-3Z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4.5"/><path d="m11.5 12.5 8 8m-3-3 3-3m-6 0 3-3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v6-2a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v6c0 4-2 6-6 6-3 0-4-1-6-4l-3-4a2 2 0 0 1 3-3Z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM9 8h6m-6 4h6m-6 4h4"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><ellipse cx="7" cy="9" rx="3" ry="5" transform="rotate(-20 7 9)"/><path d="M6 16c-2 0-2 4 1 4 3 0 3-4-1-4Z"/><ellipse cx="17" cy="15" rx="3" ry="5" transform="rotate(20 17 15)"/><path d="M18 4c2 0 2 4-1 4-3 0-3-4 1-4Z"/></symbol>
  </defs></svg>

<main class="game-panel" aria-label="和室の脱出ゲーム">
 <div id="room-viewport" class="room-viewport">
  <div id="scene" role="img" aria-label="自由に見回し、廊下と書院を巡る三次元の和室脱出ゲーム"></div><div class="scene-grain"></div>
  <div id="hotspots" class="hotspots"></div>
  <div id="loading" class="loading"><span class="loading-mark">余白</span><p>しつらえ中</p></div><div id="area-transition" class="area-transition" role="status" hidden></div>
 </div>
 <header class="site-header"><div class="brand"><h1>余白</h1><span class="live-badge">静寂の間</span><span id="game-version" class="game-version" aria-label="ゲームのバージョン">v1.5.0</span></div><nav class="header-actions" aria-label="メニュー"><button id="help-button" class="ink-button" aria-label="遊び方">手引</button><button id="sound-button" class="ink-button" aria-label="環境音をオンにする" aria-pressed="false"><svg><use href="#i-mute"/></svg><span>音</span></button><button id="settings-button" class="ink-button" aria-label="設定">設定</button></nav></header>
 <button id="map-button" class="map-button" aria-label="館の間取りを見る">間取</button><div class="view-tools" aria-label="視点操作"><button id="overhead-view" aria-label="神目線で俯瞰する" title="俯瞰">俯</button><button id="front-view" aria-label="部屋を正面から見る">正面</button><button id="zoom-in" aria-label="部屋を拡大">＋</button><button id="zoom-out" aria-label="部屋を縮小">−</button><button id="reset-view" aria-label="初期位置と視点に戻す">戻</button></div>
 <nav id="travel-options" class="travel-options" aria-label="移動できる場所" hidden></nav>
 <div class="view-indicator" aria-hidden="true"><span id="view-angle">正面</span><i></i><i class="active"></i><i></i></div>
 <div id="observation-bar" class="observation-bar" hidden><span id="observation-symbol"></span><button id="record-observation" aria-label="見え方を写す">写す</button></div>
 <section class="inventory-drawer" aria-label="持ちもの"><button id="inventory-toggle" class="inventory-toggle" aria-label="持ちものを開く" aria-expanded="false" aria-controls="inventory-panel"><span aria-hidden="true">〈 〉</span><span id="selected-item-indicator" aria-hidden="true"></span></button><div id="inventory-panel" class="inventory-panel" hidden><span class="inventory-label">持ちもの</span><div id="inventory" class="inventory"></div><button id="inspect-selected-item" aria-label="選択したアイテムを詳しく見る" disabled><svg><use href="#i-eye"/></svg></button></div></section>
 <button id="mode-toggle" class="mode-toggle" aria-label="歩行視点に切り替える" aria-pressed="false"><svg><use href="#i-walk"/></svg><span id="mode-caption">神目線</span></button>
 <footer class="game-hud"><button id="hint-button" class="hint-button">ヒント</button></footer>
 <p class="save-note" role="status"></p><p id="scene-message" class="scene-message" role="status"></p>
</main>
<dialog id="modal" class="modal" aria-labelledby="modal-title"><div class="modal-inner"><button class="modal-close" aria-label="閉じる">戻</button><div id="modal-content"></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js?v=1.5.0"></script></body></html>
